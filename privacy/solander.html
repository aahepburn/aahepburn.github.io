  <p class="page-label">Legal</p>
  <h1>Privacy Policy — Solander</h1>
  <p class="page-meta">Quiet Signals Lab &nbsp;·&nbsp; Last updated: 23 September 2026</p>

  <p class="lede">
    Your documents never leave your Mac, because the app cannot open a network connection. If you buy a licence, we hold your email address and a licence record — nothing else.
  </p>

<h2>The app</h2>

<p>
  Solander runs in Apple's App Sandbox <strong>without</strong> the network client entitlement. This is enforced by macOS, not by our policy: the operating system will refuse an outbound connection regardless of what the code asks for.
</p>

<div class="constraint-box">
  <strong>You can verify this on the copy you downloaded.</strong>
  <code>codesign -d --entitlements - /Applications/Solander.app</code>
</div>

<p>
  There is no telemetry, no analytics and no crash reporting, on any surface. No account, no sign-in, no device identifier.
</p>

<p>
  Documents you open stay in memory or in the location you choose to save to, with two exceptions, both inside the app's own sandbox container: page images held while you work, deleted when the session ends; and batch progress, which is encrypted and deleted when the batch finishes or you discard it.
</p>

<h2>Updates</h2>

<p>
  Checking for updates is the only network activity. It runs in a separate process, which receives no document data, and requests only the update feed and the download itself. It can be switched off in the app. We do not log update checks in a form tied to you.
</p>

<h2>Buying a licence</h2>

<p>
  Purchases are handled by <strong>Paddle.com Market Ltd</strong>, who act as merchant of record: they take the payment, handle VAT and issue the invoice. Their privacy notice covers what they collect — see <a href="https://www.paddle.com/legal/privacy" target="_blank" rel="noopener noreferrer">paddle.com/legal/privacy</a>. We never see your card details.
</p>

<p>
  From that purchase we receive and store:
</p>

<p>
  your email address; the name or organisation the licence is issued to; a licence ID and the Paddle transaction ID; and the date the licence was issued.
</p>

<p>
  We use these to issue your licence, to send it again if you ask, and to keep a record of what was sold. The legal basis is performance of our contract with you, GDPR Art. 6(1)(b), and for the sale record, our legal obligation under tax law, Art. 6(1)(c). We keep them for as long as the licence is supported, plus the period Dutch tax law requires us to keep records of a sale. We do not use your address for marketing and there is no mailing list.
</p>

<p>
  This licence record lives on a single serverless function, which is the only server Quiet Signals Lab operates for Solander. It never receives a document, a page image, or anything Solander detected — only the purchase details listed above.
</p>

<h2>Your licence file</h2>

<p>
  Your licence is a signed file, delivered by email. Solander checks it on your Mac against a key compiled into the app. There is no activation, no licence server, and no usage reporting — a licence works on a Mac that has never been online, and we cannot tell whether, where, or how often it is used.
</p>

<h2>This website</h2>

<p>
  No cookies, no analytics, no trackers, no embedded third-party content, and no fonts loaded from elsewhere. Our host records standard server logs, including IP addresses, for security and troubleshooting. Checkout pages are served by Paddle and are subject to Paddle's own notice.
</p>

<h2>Your rights</h2>

<p>
  You can ask for a copy of what we hold, correct it, or have it deleted — though deleting the record means we can no longer resend your licence, and the licence file already on your Mac keeps working regardless. You can also object to processing, ask for it to be restricted, or request your data in a portable form.
</p>

<p>
  Write to <a href="mailto:hello@quietsignalslab.com">hello@quietsignalslab.com</a>. Requests are handled within 30 days. You may also complain to your national data protection authority; in the Netherlands this is the <a href="https://autoriteitpersoonsgegevens.nl" target="_blank" rel="noopener noreferrer">Autoriteit Persoonsgegevens</a>.
</p>

<h2>Children</h2>

<p>
  Solander is a professional tool and is not directed at children. The app collects nothing from anyone.
</p>

<h2>Changes to this policy</h2>

<p>
  If the app's data handling ever changes, this policy will be updated before the change takes effect, with a new "last updated" date. The current policy always applies to the current version of the app.
</p>
