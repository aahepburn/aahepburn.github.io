  <h1>Refunds — Solander</h1>
  <p class="page-meta">Quiet Signals Lab &nbsp;·&nbsp; Last updated: 23 September 2026</p>

  <p class="lede">
    Fourteen days, no reason needed. Write to us within 14 days of your purchase and we will refund it in full.
  </p>

<h2>How to ask</h2>

<p>
  Email <a href="mailto:hello@quietsignalslab.com?subject=Solander%20refund">hello@quietsignalslab.com</a> from the address you bought with, within 14 days of your purchase. You do not have to explain why. Include your order or transaction number if you have it to hand — it is on the invoice Paddle sent you — but we can find the order from your email address alone.
</p>

<p>
  Refunds are processed by Paddle.com Market Ltd, our merchant of record, back to the payment method you used. It usually takes a few working days to appear, depending on your bank or card issuer.
</p>

<h2>Try before you buy</h2>

<p>
  You do not have to buy anything to find out whether Solander works on your documents. Free mode has every detector and every language, and lets you open, review, redact, export and verify one document at a time, with no time limit and no account. A licence adds working on many documents at once, the exportable evidence, and automation.
</p>

<p>
  We would rather you tested it on your own documents first than bought it and asked for the money back — which is why free mode has no clock on it.
</p>

<h2>After a refund</h2>

<div class="constraint-box">
  <strong>A refunded licence cannot be switched off remotely, and we are not going to build the machinery that would let us.</strong>
  Solander checks licences on your own Mac and never contacts a server. That is the product's central claim and it applies to us as much as to anyone else. After a refund we ask that you stop using the licensed features and delete the licence file.
</div>

<p>
  Your record of purchase is marked refunded, and we can no longer resend the licence to you.
</p>

<h2>Your statutory rights</h2>

<p>
  If you are a consumer in the EU or the UK, you have a statutory right to withdraw from a distance purchase within 14 days. Because Solander is digital content supplied immediately, that right can lapse once supply has begun with your consent — but our policy above gives you the same 14 days regardless, so you do not need to rely on it. Nothing here limits any right you have by law.
</p>
